name: checks

on:
  push:
    branches:
      - develop
  pull_request:
    types: [opened, reopened, synchronize]

jobs:
  clippy:
    runs-on: ubuntu-latest
    name: "Check & Clippy"

    steps:
      - uses: actions/checkout@v6

      - name: Install clang (required by bindgen/powersync_sqlite_nostd)
        run: sudo apt-get update -y && sudo apt-get install -y --no-install-recommends clang libclang-dev

      - uses: dtolnay/rust-toolchain@master
        id: toolchain
        with:
          # Must be >= 1.91.1 (taskchampion@3.0.2-pre MSRV).
          # Use stable to always pick up the latest stable release.
          toolchain: "stable"

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ steps.toolchain.outputs.cachekey }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo build
        uses: actions/cache@v5
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-target-${{ steps.toolchain.outputs.cachekey }}-${{ hashFiles('**/Cargo.lock') }}

      - uses: actions-rs/cargo@v1.0.3
        with:
          command: check

      - run: rustup component add clippy

      - uses: actions-rs/clippy-check@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          args: --all-features
          name: "Clippy Results"

  fmt:
    runs-on: ubuntu-latest
    name: "Formatting"
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@master
        id: toolchain
        with:
          toolchain: "stable"
          components: "rustfmt"

      - uses: actions-rs/cargo@v1.0.3
        with:
          command: fmt
          args: --all -- --check

  cargo-metadata:
    runs-on: ubuntu-latest
    name: "Cargo Metadata"
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@master
        id: toolchain
        with:
          toolchain: "stable"
          components: "rustfmt"

      - name: "Check metadata"
        run: ".github/workflows/metadata-check.sh"
