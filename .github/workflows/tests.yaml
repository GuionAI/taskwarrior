## Run the Taskwarrior tests, using stable rust to build TaskChampion.
name: tests

on: [push, pull_request]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Install apt packages
        run: sudo apt-get update -y && sudo apt-get install -y build-essential cmake git uuid-dev faketime locales python3 curl ninja-build clang libclang-dev

      - name: Check out this repository
        uses: actions/checkout@v6

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "stable"

      - name: Configure project
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug

      - name: Build project
        run: cmake --build build --target test_runner --target task_executable

      - name: Test project
        run: ctest --test-dir build -j 8 --output-on-failure

  cargo-test:
    runs-on: ubuntu-latest
    name: "Cargo Test"

    steps:
      - uses: actions/checkout@v6

      - name: Install clang (required by bindgen/powersync_sqlite_nostd)
        run: sudo apt-get update -y && sudo apt-get install -y --no-install-recommends clang libclang-dev

      - uses: dtolnay/rust-toolchain@master
        id: toolchain
        with:
          # Must be >= 1.91.1 (taskchampion@3.0.2-pre MSRV).
          # Use stable to always pick up the latest stable release.
          toolchain: "stable"

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ steps.toolchain.outputs.cachekey }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo build
        uses: actions/cache@v5
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-target-${{ steps.toolchain.outputs.cachekey }}-${{ hashFiles('**/Cargo.lock') }}

      - uses: actions-rs/cargo@v1.0.3
        with:
          command: test
