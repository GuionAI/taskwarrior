[package]
name = "taskchampion-lib"
version = "0.1.0"
edition = "2021"
publish = false
rust-version = "1.91.1"  # MSRV (taskchampion@3.0.2-pre requirement)

[lib]
crate-type = ["staticlib"]

[dependencies]
taskchampion = { git = "https://github.com/GuionAI/taskchampion.git", tag = "v3.0.2-guion.40", features = ["storage-powersync", "storage-pgwire", "test-utils"] }
anyhow = "1"
async-trait = "0.1"
cxx = "1.0.133"
tokio = { version = "1", features = [ "rt" ] }

[features]

[build-dependencies]
cxx-build = "1.0.133"

[dev-dependencies]
taskchampion = { git = "https://github.com/GuionAI/taskchampion.git", tag = "v3.0.2-guion.40", features = ["storage-powersync", "storage-pgwire", "test-utils"] }
